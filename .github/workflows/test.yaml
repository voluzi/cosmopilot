name: Test

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # `go fmt` (not a bare `gofmt`) so the go.mod toolchain formats. The make targets below
      # reformat in place, so without this check an unformatted file never fails CI.
      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Run Unit Tests
        run: make test.unit

      - name: Run Integration Tests
        run: make test.integration