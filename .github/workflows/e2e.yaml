name: E2E Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Ginkgo focus filter (regex pattern)'
        required: false
        default: ''
      skip:
        description: 'Ginkgo skip filter (regex pattern)'
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Images are built once and handed over as tarballs; only the shared shard needs MinIO.
  # Layers are cached in the Actions cache on top of that, which is what keeps this job short on the
  # common run where only test code moved.
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      controller-image: ${{ steps.images.outputs.controller }}
      node-utils-image: ${{ steps.images.outputs.node-utils }}
      dataexporter-image: ${{ steps.images.outputs.dataexporter }}
      minio-image: ${{ steps.images.outputs.minio }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Image tags come from `git describe`, so the tags have to be fetched.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Resolved once and passed down, so the job that builds and the jobs that load cannot end up
      # disagreeing about the name.
      - name: Resolve image tags
        id: images
        run: |
          controller="$(make -s print-IMG)"
          node_utils="$(make -s print-NODE_UTILS_IMG)"
          dataexporter="$(make -s print-DATA_EXPORTER_IMG)"
          minio="$(make -s print-MINIO_IMG)"

          # Component tags come out of `git describe`, so an unfetched tag or a shallow clone yields a
          # reference with nothing after the colon. Caught here it costs twenty seconds; carried
          # forward it surfaces as an opaque `docker load` failure in six parallel shards.
          for image in "$controller" "$node_utils" "$dataexporter" "$minio"; do
            case "$image" in
              *:?*) ;;
              *) echo "::error::could not resolve an image tag: '$image'"; exit 1 ;;
            esac
          done

          echo "controller=$controller" >> "$GITHUB_OUTPUT"
          echo "node-utils=$node_utils" >> "$GITHUB_OUTPUT"
          echo "dataexporter=$dataexporter" >> "$GITHUB_OUTPUT"
          echo "minio=$minio" >> "$GITHUB_OUTPUT"

      # Written straight out as tarballs rather than loaded into this runner's daemon and saved back:
      # only the shards need them in a daemon.
      - name: Build images
        run: |
          mkdir -p /tmp/images
          make docker-build DOCKER_BUILD="docker buildx build \
            --cache-from=type=gha,scope=cosmopilot \
            --cache-to=type=gha,scope=cosmopilot,mode=max \
            --output=type=docker,dest=/tmp/images/cosmopilot.tar"
          make docker-build-nodeutils DOCKER_BUILD="docker buildx build \
            --cache-from=type=gha,scope=node-utils \
            --cache-to=type=gha,scope=node-utils,mode=max \
            --output=type=docker,dest=/tmp/images/node-utils.tar"
          make docker-build-dataexporter DOCKER_BUILD="docker buildx build \
            --cache-from=type=gha,scope=dataexporter \
            --cache-to=type=gha,scope=dataexporter,mode=max \
            --output=type=docker,dest=/tmp/images/dataexporter.tar"
          make docker-build-minio DOCKER_BUILD="docker buildx build \
            --cache-from=type=gha,scope=minio \
            --cache-to=type=gha,scope=minio,mode=max \
            --output=type=docker,dest=/tmp/images/minio.tar"

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: e2e-images
          path: |
            /tmp/images/cosmopilot.tar
            /tmp/images/node-utils.tar
            /tmp/images/dataexporter.tar
          retention-days: 1

      - name: Upload MinIO image
        uses: actions/upload-artifact@v7
        with:
          name: e2e-minio-image
          path: /tmp/images/minio.tar
          retention-days: 1

  e2e:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      # A failure in one app says nothing about the others, and knowing whether it is one app or all
      # of them is most of the diagnosis.
      fail-fast: false
      matrix:
        # The shards below partition the suite exactly: every spec runs in one of them, none runs
        # twice. `per-app` is attached by apps.ForEachApp, so setting TEST_APPS to a single app makes
        # that shard the whole fan-out for that app; the negated filters pick up the remainder.
        include:
          - shard: nibiru
            apps: nibiru
            labels: 'per-app'
          - shard: osmosis
            apps: osmosis
            labels: 'per-app'
          - shard: cosmoshub
            apps: cosmoshub
            labels: 'per-app'
          - shard: allora
            apps: allora
            labels: 'per-app'
          # Own shard because it is the heaviest group that does not fan out per app, and left in
          # with the rest it decided the whole suite's wall-clock on its own.
          - shard: cosmosigner
            apps: ''
            labels: '!per-app && cosmosigner'
          # Everything else. TEST_APPS is deliberately left empty: a spec that enumerates apps.All()
          # itself would silently lose entries if this shard were narrowed to one app.
          - shard: shared
            apps: ''
            labels: '!per-app && !cosmosigner'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure kernel parameters
        run: |
          sudo tee /etc/sysctl.d/99-kubernetes.conf <<EOF
          fs.inotify.max_user_watches=1048576
          fs.inotify.max_user_instances=8192
          net.ipv4.ip_unprivileged_port_start=0
          EOF
          sudo sysctl -p /etc/sysctl.d/99-kubernetes.conf

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download images
        uses: actions/download-artifact@v8
        with:
          name: e2e-images
          path: /tmp/images

      - name: Download MinIO image
        if: ${{ matrix.shard == 'shared' }}
        uses: actions/download-artifact@v8
        with:
          name: e2e-minio-image
          path: /tmp/images

      - name: Load images
        run: |
          docker load -i /tmp/images/cosmopilot.tar
          docker load -i /tmp/images/node-utils.tar
          docker load -i /tmp/images/dataexporter.tar
          if [ '${{ matrix.shard }}' = shared ]; then
            docker load -i /tmp/images/minio.tar
          fi

      - name: Run E2E Tests (${{ matrix.shard }})
        run: |
          make test.e2e \
            BUILD_IMAGES=false \
            BUILD_MINIO=${{ matrix.shard == 'shared' }} \
            IMG='${{ needs.build-images.outputs.controller-image }}' \
            NODE_UTILS_IMG='${{ needs.build-images.outputs.node-utils-image }}' \
            DATA_EXPORTER_IMG='${{ needs.build-images.outputs.dataexporter-image }}' \
            MINIO_IMG='${{ needs.build-images.outputs.minio-image }}' \
            TEST_TIMEOUT=25m \
            PROCS=4 \
            REUSE_CLUSTER=false \
            TEST_APPS='${{ matrix.apps }}' \
            LABEL_FILTER='${{ matrix.labels }}' \
            FOCUS="${{ github.event.inputs.focus || '' }}" \
            SKIP="${{ github.event.inputs.skip || '' }}"
