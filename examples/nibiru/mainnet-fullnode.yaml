apiVersion: cosmopilot.voluzi.com/v1
kind: ChainNodeSet
metadata:
  name: nibiru
spec:
  app:
    image: ghcr.io/nibiruchain/nibiru
    version: 2.20.0
    app: nibid
    sdkVersion: v0.47

  genesis:
    url: https://raw.githubusercontent.com/NibiruChain/Networks/refs/heads/main/Mainnet/cataclysm-1/genesis.json

  nodes:
    - name: fullnodes
      instances: 1

      peers:
        # Current public mainnet node (rpc.nibiru.fi/status).
        - id: ac580cf22cb356a61fd495bbafd849071b908031
          address: 35.195.24.164

      persistence:
        size: 500Gi
        initTimeout: 6h
        additionalInitCommands:
          - image: ghcr.io/voluzi/node-tools
            command: [ "sh" ]
            args:
              - "-c"
              - |
                set -eu
                set -o pipefail
                SNAPSHOT_URL=$(curl -fsSL https://networks.nibiru.fi/cataclysm-1/snapshots | jq -er '[.[] | select(endswith("pruned-pebbledb.tar.gz"))] | last')
                curl -fL --retry 3 "$SNAPSHOT_URL" | tar -xzf - -C /home/app/data

      config:
        override:
          config.toml:
            db_backend: pebbledb
          app.toml:
            minimum-gas-prices: 0.025unibi
