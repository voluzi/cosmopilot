# Three sentry endpoints share one software signer and one genesis validator identity.
# The genesis ConfigMap and disposable test key are included below.
apiVersion: cosmopilot.voluzi.com/v1
kind: ChainNodeSet
metadata:
  name: nibiru-testnet
spec:
  app:
    image: ghcr.io/nibiruchain/nibiru
    version: 2.21.0
    app: nibid
    sdkVersion: v0.47

  genesis:
    configMap: nibiru-sentry-testnet-genesis

  cosmosigner:
    nodeGroups: [fullnodes]
    replicas: 3
    # Isolated local testnet only; production HA requires raftTLSSecret.
    unsafeAllowInsecureRaft: true
    backend:
      software:
        privateKeySecret: nibiru-sentry-testnet-key-1

  nodes:
    - name: fullnodes
      instances: 3
      config:
        override:
          app.toml:
            minimum-gas-prices: 0.025unibi

---
