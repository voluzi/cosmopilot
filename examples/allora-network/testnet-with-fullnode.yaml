apiVersion: cosmopilot.voluzi.com/v1
kind: ChainNodeSet
metadata:
  name: allora-testnet
spec:
  app:
    image: alloranetwork/allora-chain
    version: v0.17.2
    app: allorad
    sdkVersion: v0.50

  validator:
    # The upstream image is published for linux/amd64 only.
    nodeSelector:
      kubernetes.io/arch: amd64
    accountPrefix: allo
    valPrefix: allovaloper

    info:
      moniker: cosmopilot

    config:
      override:
        app.toml:
          minimum-gas-prices: 10uallo

    init:
      chainID: allora-testnet-0
      # Allora uses 18 decimal places: 1 ALLO = 10^18 uallo.
      assets: ["1000000000000000000000000000uallo"]
      stakeAmount: 10000000000000000000uallo
      unbondingTime: 60s
      votingPeriod: 60s
      expeditedVotingPeriod: 30s
      additionalInitCommands:
        # Use uALLO as default denom
        - image: busybox
          command: [ "sh", "-c" ]
          args:
            - sed -i 's/"stake"/"uallo"/g' /home/app/config/genesis.json;

  nodes:
    - name: fullnodes
      instances: 1
      nodeSelector:
        kubernetes.io/arch: amd64

      config:
        override:
          app.toml:
            minimum-gas-prices: 10uallo
            pruning: custom
            pruning-keep-recent: "100"
            pruning-interval: "10"
